<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moto Inversiones</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --purple:#534AB7;--green:#3B6D11;--green-bg:#EAF3DE;--green-text:#27500A;
    --blue-bg:#E6F1FB;--blue-text:#0C447C;--amber:#854F0B;--amber-bg:#FAEEDA;
    --red:#A32D2D;--border:#e5e7eb;--bg:#f9fafb;--card:#ffffff;
    --text:#111827;--muted:#6b7280;--radius:12px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .app{max-width:480px;margin:0 auto;padding:0 0 80px}
  .header{background:#fff;border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
  .header h1{font-size:17px;font-weight:600}
  .header p{font-size:12px;color:var(--muted);margin-top:1px}
  .save-pill{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--green-bg);color:var(--green-text);font-weight:500}
  .save-pill.saving{background:var(--amber-bg);color:var(--amber)}
  .save-pill.error{background:#FCEBEB;color:#791F1F}
  .kpi-section{padding:14px 16px}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
  .kpi-label{font-size:11px;color:var(--muted);margin-bottom:4px}
  .kpi-value{font-size:22px;font-weight:600;line-height:1}
  .kpi-sub{font-size:11px;color:var(--muted);margin-top:3px}
  .kpi-value.up{color:var(--green)}
  .nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);scrollbar-width:none;position:sticky;top:57px;z-index:40}
  .nav::-webkit-scrollbar{display:none}
  .nav-btn{flex-shrink:0;padding:11px 16px;font-size:13px;font-weight:500;border:none;background:transparent;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .nav-btn.active{color:var(--purple);border-bottom-color:var(--purple)}
  .content{padding:16px}
  .sec-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
  .cr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--border);font-size:13px}
  .cr:first-child{border-top:none}
  .crl{color:var(--muted)}
  .crv{font-weight:600}
  .crg{font-weight:600;color:var(--green)}
  .crn{font-weight:600;color:var(--red)}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .b-sold{background:var(--green-bg);color:var(--green-text)}
  .b-active{background:var(--blue-bg);color:var(--blue-text)}
  .moto-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:10px}
  .moto-name{font-size:14px;font-weight:600;line-height:1.3}
  .moto-date{font-size:11px;color:var(--muted);margin-top:2px}
  .time-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:var(--radius-sm);padding:10px;margin:10px 0}
  .tc{text-align:center}
  .tv{font-size:13px;font-weight:600}
  .tv.up{color:var(--green)}
  .tl{font-size:10px;color:var(--muted);margin-top:2px}
  .inv-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
  .inv-row:first-child{border-top:none}
  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
  .bar-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
  .bar-fill{height:100%;border-radius:2px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;width:100%}
  .btn-primary{background:var(--text);color:#fff}
  .btn-primary:active{opacity:.85}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .btn-green{background:transparent;border:1px solid var(--green);color:var(--green)}
  .btn-green:active{background:var(--green-bg)}
  .btn-amber{background:transparent;border:1px dashed var(--amber);color:var(--amber)}
  .btn-dashed{background:transparent;border:1px dashed var(--border);color:var(--muted)}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted)}
  .btn-danger-sm{border-color:#fca5a5;color:var(--red)}
  .btn-row{display:flex;gap:8px;margin-top:10px}
  .extra-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
  .extra-item:first-child{border-top:none}
  .tl-item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
  .tl-item:first-child{border-top:none}
  .tl-dc{display:flex;flex-direction:column;align-items:center;padding-top:3px}
  .tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .tl-line{flex:1;width:1px;background:var(--border);margin-top:3px}
  .chart-wrap{position:relative;width:100%;height:200px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
  .leg-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  .leg-dot{width:10px;height:10px;border-radius:2px}
  .proj-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:13px}
  .proj-row:first-child{border-top:none}
  .range-wrap{display:flex;align-items:center;gap:10px}
  .range-wrap input[type=range]{flex:1;accent-color:var(--purple)}
  .range-val{font-size:14px;font-weight:600;min-width:38px;text-align:right;color:var(--purple)}
  .sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .sim-r{background:var(--bg);border-radius:var(--radius-sm);padding:12px;text-align:center;border:1px solid var(--border)}
  .sim-rv{font-size:20px;font-weight:700}
  .sim-rl{font-size:11px;color:var(--muted);margin-top:3px}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 20px 40px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
  .sheet h3{font-size:16px;font-weight:600;margin-bottom:16px}
  .fg{margin-bottom:14px}
  .fg label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
  .fg input,.fg select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:#fff;color:var(--text)}
  .fg input:focus,.fg select:focus{outline:none;border-color:var(--purple)}
  .sheet-actions{display:flex;gap:10px;margin-top:16px}
  .sheet-actions .btn{flex:1}
  .contrib-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .contrib-name{width:70px;font-size:13px;color:var(--muted)}
  .contrib-row input{flex:1}
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:360px;text-align:center}
  .gate-card h2{font-size:20px;font-weight:700;margin-bottom:6px}
  .gate-card p{font-size:13px;color:var(--muted);margin-bottom:20px}
  .gate-card input{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;text-align:center;letter-spacing:4px;margin-bottom:12px}
  .gate-error{font-size:13px;color:var(--red);margin-top:8px;min-height:20px}
</style>
</head>
<body>

<div class="gate" id="gateScreen">
  <div class="gate-card">
    <div style="font-size:40px;margin-bottom:12px">🏍️</div>
    <h2>Moto Inversiones</h2>
    <p>Octavio · Nacho · Anita</p>
    <input type="password" id="pinInput" placeholder="••••" maxlength="20" onkeydown="if(event.key==='Enter')checkPin()">
    <button class="btn btn-primary" onclick="checkPin()">Entrar</button>
    <div class="gate-error" id="pinError"></div>
  </div>
</div>

<div id="mainApp" style="display:none">
<div class="app">
  <div class="header">
    <div>
      <h1>🏍️ Moto Inversiones</h1>
      <p>Octavio · Nacho · Anita</p>
    </div>
    <div class="save-pill" id="savePill">✓ Guardado</div>
  </div>
  <div class="kpi-section"><div class="kpi-grid" id="kpiGrid"></div></div>
  <div class="nav">
    <button class="nav-btn active" data-tab="resumen" onclick="sw('resumen')">Resumen</button>
    <button class="nav-btn" data-tab="motos" onclick="sw('motos')">Motos</button>
    <button class="nav-btn" data-tab="socios" onclick="sw('socios')">Socios</button>
    <button class="nav-btn" data-tab="historial" onclick="sw('historial')">Historial</button>
    <button class="nav-btn" data-tab="proyeccion" onclick="sw('proyeccion')">Proyección</button>
    <button class="nav-btn" data-tab="simulador" onclick="sw('simulador')">Simulador</button>
  </div>
  <div class="content" id="tabContent"></div>
</div>
</div>

<!-- MODAL: Agregar moto -->
<div class="overlay" id="overlayAddMoto">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>➕ Agregar moto</h3>
    <div class="fg"><label>Nombre</label><input type="text" id="mNom" placeholder="Ej: 2023 Honda CBR 600RR"></div>
    <div class="fg"><label>Fecha de compra</label><input type="date" id="mFecha"></div>
    <div class="fg"><label>Costo (USD)</label><input type="number" id="mCosto" placeholder="0" min="0"></div>
    <div class="fg"><label>Aportes extra por socio (si alguno pone más)</label><div id="mExtras"></div></div>
    <div class="sheet-actions">
      <button class="btn btn-outline" onclick="closeOverlay('overlayAddMoto')">Cancelar</button>
      <button class="btn btn-primary" onclick="doAddMoto()">Agregar</button>
    </div>
  </div>
</div>

<!-- MODAL: Editar moto -->
<div class="overlay" id="overlayEditMoto">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>✏️ Editar moto</h3>
    <div class="fg"><label>Nombre</label><input type="text" id="eNom"></div>
    <div class="fg"><label>Fecha de compra</label><input type="date" id="eFecha"></div>
    <div class="fg"><label>Costo de compra (USD)</label><input type="number" id="eCosto" min="0"></div>
    <div class="fg"><label>Aportes extra por socio</label><div id="eExtras"></div></div>
    <div class="sheet-actions">
      <button class="btn btn-outline" onclick="closeOverlay('overlayEditMoto')">Cancelar</button>
      <button class="btn btn-primary" onclick="doEditMoto()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: Venta -->
<div class="overlay" id="overlaySell">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>💰 Registrar venta</h3>
    <div class="fg"><label>Fecha de venta</label><input type="date" id="sFecha"></div>
    <div class="fg"><label>Precio de venta (USD)</label><input type="number" id="sPrecio" placeholder="0" min="0"></div>
    <div class="fg"><label>% comisión concesionario</label><input type="number" id="sComm" value="10" min="0" max="100"></div>
    <div class="sheet-actions">
      <button class="btn btn-outline" onclick="closeOverlay('overlaySell')">Cancelar</button>
      <button class="btn btn-primary" onclick="doSell()">Confirmar venta</button>
    </div>
  </div>
</div>

<!-- MODAL: Costo extra -->
<div class="overlay" id="overlayAddCost">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>🔧 Agregar costo</h3>
    <div class="fg"><label>Descripción</label><input type="text" id="cDesc" placeholder="Ej: Service, cadena, frenos..."></div>
    <div class="fg"><label>Monto (USD)</label><input type="number" id="cAmt" placeholder="0" min="0"></div>
    <div class="fg"><label>Fecha</label><input type="date" id="cDate"></div>
    <div class="fg"><label>¿Quién lo paga? (cuenta como aporte extra)</label>
      <select id="cPayer">
        <option value="">-- Se reparte proporcionalmente --</option>
      </select>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-outline" onclick="closeOverlay('overlayAddCost')">Cancelar</button>
      <button class="btn btn-primary" onclick="doAddCost()">Guardar</button>
    </div>
  </div>
</div>

<script>
const PIN = '1234';
const SK = 'moto_inv_v5';

const DEF = {
  investors:[
    {id:'octa',name:'Octavio',initials:'OC',color:'#534AB7',cap:4600},
    {id:'nacho',name:'Nacho',initials:'NA',color:'#0F6E56',cap:2500},
    {id:'anita',name:'Anita',initials:'AN',color:'#993C1D',cap:2500}
  ],
  motos:[
    {id:'m1',name:'2016 Kawasaki Ninja ZX-6R',cost:5850,buyDate:'2026-03-19',
     sold:true,saleDate:'2026-05-16',salePrice:8000,comm:10,netSale:7200,
     extras:{octa:0,nacho:0,anita:0},extraCosts:[]},
    {id:'m2',name:'2019 Harley Davidson 883 Iron',cost:3750,buyDate:'2026-03-19',
     sold:false,saleDate:null,salePrice:null,comm:10,netSale:null,
     extras:{octa:0,nacho:0,anita:0},extraCosts:[]},
    {id:'m3',name:'2026 Kawasaki Ninja ZX-6R',cost:9600,buyDate:'2026-06-01',
     sold:false,saleDate:null,salePrice:null,comm:10,netSale:null,
     extras:{octa:2400,nacho:0,anita:0},extraCosts:[]}
  ],
  nextId:4
};

let S=null, activeTab='resumen', sellId=null, editId=null, costId=null, chart=null, saveTimer=null;

// ── PIN ──────────────────────────────────────────────────
function checkPin(){
  if(document.getElementById('pinInput').value===PIN){
    document.getElementById('gateScreen').style.display='none';
    document.getElementById('mainApp').style.display='block';
    loadData();
  } else {
    document.getElementById('pinError').textContent='PIN incorrecto.';
    document.getElementById('pinInput').value='';
  }
}

// ── STORAGE ──────────────────────────────────────────────
function loadData(){
  try {
    const raw=localStorage.getItem(SK);
    if(raw){
      S=JSON.parse(raw);
      // migración: asegurar campos
      S.motos.forEach(m=>{
        if(!m.extras)m.extras={};
        if(!m.extraCosts)m.extraCosts=[];
        DEF.investors.forEach(i=>{if(m.extras[i.id]===undefined)m.extras[i.id]=0;});
        // migración: extraCosts con payer
        m.extraCosts.forEach(c=>{if(!c.payer)c.payer='';});
      });
    } else {
      S=JSON.parse(JSON.stringify(DEF));
    }
  } catch(e){ S=JSON.parse(JSON.stringify(DEF)); }
  renderAll();
}

function schedSave(){
  pill('Guardando...','saving');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(SK,JSON.stringify(S)); pill('✓ Guardado',''); }
    catch(e){ pill('Error al guardar','error'); }
  },600);
}

function pill(t,c){ const e=document.getElementById('savePill'); e.textContent=t; e.className='save-pill '+c; }

// ── HELPERS ──────────────────────────────────────────────
const tod=()=>new Date().toISOString().split('T')[0];
const dys=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const fmt=n=>'$'+Math.round(n).toLocaleString('es-AR');
const pct=n=>(n*100).toFixed(1)+'%';
const fD=d=>{if(!d)return'-';const[y,m,dd]=d.split('-');return`${+dd} ${'ene feb mar abr may jun jul ago sep oct nov dic'.split(' ')[+m-1]} ${y}`;};
const hld=d=>{if(d<1)return'0d';if(d<30)return`${d}d`;const mo=Math.floor(d/30),r=d%30;return r?`${mo}m ${r}d`:`${mo}m`;};

// ── MATH ─────────────────────────────────────────────────
const totalInitCap = () => S.investors.reduce((a,i)=>a+i.cap,0);
const invBaseSh    = inv => inv.cap / totalInitCap();

// Costos de reparación/service de una moto
const repairTotal  = m => (m.extraCosts||[]).reduce((a,c)=>a+c.amount,0);

// Costo total real de la moto (precio compra + reparaciones)
const effCost      = m => m.cost + repairTotal(m);

// Aportes extra al momento de la compra (quien puso más del proporcional)
const buyExtrasTotal = m => Object.values(m.extras||{}).reduce((a,b)=>a+b,0);

// Cuánto puso un socio en una moto específica:
// - parte proporcional del costo de compra (descontando aportes extra de otros)
// - más su aporte extra de compra
// - más los costos de reparación que él pagó
const motoInvCost = (m, inv) => {
  const basePool = m.cost - buyExtrasTotal(m);
  const propPart = Math.max(0, basePool * invBaseSh(inv));
  const extraBuy = m.extras[inv.id] || 0;
  const repairs  = (m.extraCosts||[]).filter(c=>c.payer===inv.id).reduce((a,c)=>a+c.amount,0);
  return propPart + extraBuy + repairs;
};

// Ganancia de una moto vendida = neto recibido - costo total (compra + reparaciones)
const motoGain = m => m.sold ? m.netSale - effCost(m) : null;

// Ganancia de un socio en una moto vendida, proporcional a su participación
const invGainMoto = (m, inv) => {
  if(!m.sold) return 0;
  const g = motoGain(m);
  const ec = effCost(m);
  const p = ec>0 ? motoInvCost(m,inv)/ec : invBaseSh(inv);
  return g * p;
};

// Total invertido por un socio (cap inicial + aportes extra compra + reparaciones pagadas)
const invTotalInvested = inv => {
  return inv.cap + S.motos.reduce((a,m)=>{
    const extraBuy = m.extras[inv.id]||0;
    const repairs  = (m.extraCosts||[]).filter(c=>c.payer===inv.id).reduce((s,c)=>s+c.amount,0);
    return a + extraBuy + repairs;
  },0);
};

// Ganancias realizadas de un socio
const invTotalGains = inv => S.motos.filter(m=>m.sold).reduce((a,m)=>a+invGainMoto(m,inv),0);

// Capital actual de un socio
const invTotCap = inv => invTotalInvested(inv) + invTotalGains(inv);

// Capital total del pool
const totCap = () => S.investors.reduce((a,inv)=>a+invTotCap(inv),0);

// ── RENDER ───────────────────────────────────────────────
function renderAll(){ renderKPIs(); renderTab(); }

function renderKPIs(){
  const cap=totCap();
  const totalInv=S.investors.reduce((a,inv)=>a+invTotalInvested(inv),0);
  const gain=S.motos.filter(m=>m.sold).reduce((a,m)=>a+(motoGain(m)||0),0);
  const roi=totalInv>0?gain/totalInv:0;
  const dA=dys('2026-03-19',tod());
  const mr=dA>0?roi/(dA/30):0;
  const sold=S.motos.filter(m=>m.sold).length, act=S.motos.filter(m=>!m.sold).length;
  // ROI realizado: solo capital que participó en motos vendidas
  const capRotado = S.motos.filter(m=>m.sold).reduce((a,m)=>a+effCost(m),0);
  const roiRealizado = capRotado>0 ? gain/capRotado : 0;
  const mrRealizado = dA>0 ? roiRealizado/(dA/30) : 0;

  document.getElementById('kpiGrid').innerHTML=`
    <div class="kpi"><div class="kpi-label">Capital total</div><div class="kpi-value">${fmt(cap)}</div><div class="kpi-sub">Invertido ${fmt(totalInv)}</div></div>
    <div class="kpi"><div class="kpi-label">Ganancia realizada</div><div class="kpi-value up">${fmt(gain)}</div><div class="kpi-sub">${sold} venta${sold!==1?'s':''}</div></div>
    <div class="kpi"><div class="kpi-label">ROI realizado</div><div class="kpi-value up">${pct(roiRealizado)}</div><div class="kpi-sub">${pct(mrRealizado)}/mes · ventas cerradas</div></div>
    <div class="kpi"><div class="kpi-label">ROI total</div><div class="kpi-value">${pct(roi)}</div><div class="kpi-sub">${pct(mr)}/mes · todo el capital</div></div>`;
}

function sw(t){
  activeTab=t;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  renderTab();
}

function renderTab(){
  const el=document.getElementById('tabContent');
  if(!el)return;
  if(activeTab==='resumen')      el.innerHTML=rResumen();
  else if(activeTab==='motos')   el.innerHTML=rMotos();
  else if(activeTab==='socios')  el.innerHTML=rSocios();
  else if(activeTab==='historial') el.innerHTML=rHistorial();
  else if(activeTab==='proyeccion'){el.innerHTML=rProyeccion(); bindProj();}
  else if(activeTab==='simulador') el.innerHTML=rSimulador();
  if(activeTab==='resumen') setTimeout(rEvoChart,100);
}

// ── RESUMEN ──────────────────────────────────────────────
function rResumen(){
  const cap=totCap();
  const rows=S.investors.map(inv=>{
    const c=invTotCap(inv), inv2=invTotalInvested(inv), g=invTotalGains(inv);

function rEvoChart(){
  const ctx=document.getElementById('evoChart');
  if(!ctx)return;
  if(chart){chart.destroy();chart=null;}
  const labels=['Inicio'];
  const ds=S.investors.map(inv=>({
    label:inv.name,data:[inv.cap],
    borderColor:inv.color,backgroundColor:inv.color+'18',
    tension:.4,fill:false,pointRadius:4,pointBackgroundColor:inv.color,borderWidth:2
  }));
  let run=S.investors.map(i=>i.cap);
  S.motos.filter(m=>m.sold).sort((a,b)=>a.saleDate>b.saleDate?1:-1).forEach(m=>{
    labels.push(fD(m.saleDate));
    S.investors.forEach((inv,i)=>{run[i]+=invGainMoto(m,inv);ds[i].data.push(Math.round(run[i]));});
  });
  const leg=document.getElementById('chartLegend');
  if(leg) leg.innerHTML=S.investors.map(inv=>`<span class="leg-item"><span class="leg-dot" style="background:${inv.color}"></span>${inv.name}</span>`).join('');
  chart=new Chart(ctx,{type:'line',data:{labels,datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{y:{ticks:{callback:v=>'$'+Math.round(v/1000)+'k'},grid:{color:'rgba(0,0,0,.05)'}},
            x:{grid:{display:false},ticks:{font:{size:11}}}}
  }});
}

// ── SOCIOS ───────────────────────────────────────────────
function rSocios(){
  const sold=S.motos.filter(m=>m.sold), dA=dys('2026-03-19',tod());
  return S.investors.map(inv=>{
    const c=invTotCap(inv), inv2=invTotalInvested(inv), g=invTotalGains(inv);
    const r=inv2>0?g/inv2:0, mr=dA>0?r/(dA/30):0;
    // ROI realizado: sobre el capital que el socio puso en motos ya vendidas
    const capRotadoInv=S.motos.filter(m=>m.sold).reduce((a,m)=>a+motoInvCost(m,inv),0);
    const rRealizado=capRotadoInv>0?g/capRotadoInv:0;
    const extras=S.motos.reduce((a,m)=>{
      const eb=m.extras[inv.id]||0;

    const mRows=sold.map(m=>{
      const d=dys(m.buyDate,m.saleDate);
      return`<div class="cr"><span class="crl" style="font-size:12px">${m.name.split(' ').slice(0,3).join(' ')} <small>(${hld(d)})</small></span><span class="crg">+${fmt(invGainMoto(m,inv))}</span></div>`;

        <div class="avatar" style="width:44px;height:44px;font-size:15px;background:${inv.color}22;color:${inv.color}">${inv.initials}</div>
        <div><div style="font-size:15px;font-weight:700">${inv.name}</div><div style="font-size:11px;color:var(--muted)">${pct(invBaseSh(inv))} del capital inicial</div></div>

      <div class="cr"><span class="crl">Aportes extra + reparaciones</span><span class="crv">${fmt(extras)}</span></div>

// ── PROYECCIÓN ───────────────────────────────────────────
function rProyeccion(){
  const cap=totCap(), dA=dys('2026-03-19',tod());
  const totalInv=S.investors.reduce((a,inv)=>a+invTotalInvested(inv),0);
  const gain=S.motos.filter(m=>m.sold).reduce((a,m)=>a+(motoGain(m)||0),0);
  const avgMr=dA>0&&totalInv>0?(gain/totalInv)/(dA/30):0.05;
  const ir=Math.min(30,Math.max(1,Math.round(avgMr*100)));
  return`
    <div class="sec-lbl">Proyección compuesta</div>
    <div class="card" style="margin-bottom:12px">
      <div class="cr" style="border-top:none"><span class="crl">Capital base actual</span><span class="crv">${fmt(cap)}</span></div>
      <div class="cr"><span class="crl">ROI mensual actual</span><span class="crg">${pct(avgMr)}/mes</span></div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:500">Ajustá el ROI mensual esperado</div>
      <div class="range-wrap">
        <input type="range" id="projRate" min="1" max="30" step="1" value="${ir}">
        <span class="range-val" id="projRateOut">${ir}%</span>
      </div>
    </div>
    <div id="projTable"></div>`;
}

function bindProj(){
  const sl=document.getElementById('projRate');
  if(!sl)return;
  const upd=()=>{
    const r=parseInt(sl.value)/100;
    document.getElementById('projRateOut').textContent=`${parseInt(sl.value)}%`;
    const cap=totCap();
    const rows=[1,2,3,6,9,12,18,24].map(mo=>{
      const proj=cap*Math.pow(1+r,mo), g=proj-cap;
      return`<div class="proj-row"><span style="color:var(--muted)">${mo} mes${mo>1?'es':''}</span><div style="text-align:right"><span style="font-weight:600">${fmt(proj)}</span><span style="font-size:12px;color:var(--green);margin-left:8px">+${fmt(g)}</span></div></div>`;
    }).join('');
    document.getElementById('projTable').innerHTML=`<div class="card">${rows}</div>`;
  };
  sl.addEventListener('input',upd);
  upd();
}

function rSimulador(){
  const act=S.motos.filter(m=>!m.sold);
  const opts=act.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  return`
    <div class="sec-lbl">Simulador de venta</div>
    <div class="card" style="margin-bottom:12px">
      ${!act.length?`<p style="font-size:13px;color:var(--muted)">No hay motos en cartera.</p>`:`
      <div class="fg"><label>Moto</label><select id="simMoto">${opts}</select></div>
      <div class="fg"><label>Precio hipotético (USD)</label><input type="number" id="simPrecio" placeholder="0"></div>
      <div class="fg"><label>% comisión</label><input type="number" id="simComm" value="10"></div>
      <button class="btn btn-primary" onclick="calcSim()">🔢 Calcular</button>`}
    </div>
    <div id="simResults"></div>`;
}

function calcSim(){
  const mId=document.getElementById('simMoto').value;
  const precio=parseFloat(document.getElementById('simPrecio').value);
  const comm=parseFloat(document.getElementById('simComm').value)||10;
  if(!precio||precio<=0){alert('Ingresá un precio válido.');return;}
  const m=S.motos.find(x=>x.id===mId); if(!m)return;
  const neto=precio*(1-comm/100), ec=effCost(m), gain=neto-ec;
  const d=dys(m.buyDate,tod()), gpd=d>0?gain/d:0, mroi=ec>0?(gpd*30)/ec:0;
  const nuevoTot=totCap()+gain;
  const invRows=S.investors.map(inv=>{
    const p=ec>0?motoInvCost(m,inv)/ec:invBaseSh(inv), ig=gain*p, nc=invTotCap(inv)+ig;
    return`<div class="cr"><span class="crl" style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:${inv.color};display:inline-block"></span>${inv.name}</span><span><span class="${gain>=0?'crg':'crn'}">${gain>=0?'+':''}${fmt(ig)}</span> <small style="color:var(--muted)">→ ${fmt(nc)}</small></span></div>`;
  }).join('');
  document.getElementById('simResults').innerHTML=`
    <div class="sim-grid">
      <div class="sim-r"><div class="sim-rv" style="color:${gain>=0?'var(--green)':'var(--red)'}">${fmt(gain)}</div><div class="sim-rl">Ganancia</div></div>
      <div class="sim-r"><div class="sim-rv" style="color:${gain>=0?'var(--green)':'var(--red)'}">${pct(gain/ec)}</div><div class="sim-rl">ROI</div></div>
      <div class="sim-r"><div class="sim-rv">${fmt(neto)}</div><div class="sim-rl">Neto recibido</div></div>
      <div class="sim-r"><div class="sim-rv" style="color:${mroi>=0?'var(--green)':'var(--red)'}">${pct(mroi)}/m</div><div class="sim-rl">ROI mensual</div></div>
    </div>
    <div class="card">
      <div class="cr" style="border-top:none"><span class="crl">Nuevo capital total</span><span class="crv">${fmt(nuevoTot)}</span></div>
      <div style="font-size:11px;color:var(--muted);margin:8px 0 4px">Por socio:</div>${invRows}
    </div>`;
}

function doAddMoto(){
  const name=document.getElementById('mNom').value.trim();

  if(!name||isNaN(cost)||cost<=0||!buyDate){alert('Completá todos los campos.');return;}

function doAddCost(){
  const desc=document.getElementById('cDesc').value.trim();
  const amt=parseFloat(document.getElementById('cAmt').value);

function delCost(motoId,idx){
  if(!confirm('¿Eliminar este costo?'))return;
  const m=S.motos.find(x=>x.id===motoId);

  schedSave(); renderAll();
}

document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open');});
});
</script>
</body>
</html>
